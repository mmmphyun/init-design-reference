<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design Reference - Typography & Tokens Preview</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-surface: #1e293b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin: 0;
      padding: 2rem;
      line-height: 1.5;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      font-size: 2.25rem;
      letter-spacing: -0.03em;
      margin-bottom: 0.5rem;
    }
    .spec-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 0.375rem;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }
    .mono {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8125rem;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>타이포그래피 및 토큰 프리뷰</h1>
    <p style="color: var(--text-muted);">
      다국어 혼합 렌더링 검증: Space Grotesk / Pretendard / JetBrains Mono
    </p>
    <div class="spec-card">
      <div class="mono">Display + Body Mixed String Test</div>
      <p style="font-size: 1.25rem; font-weight: 600; margin: 0.5rem 0;">
        시스템 보안 관제 시스템 (Security Monitoring Suite) v2.4.0
      </p>
      <p style="color: var(--text-muted); font-size: 0.875rem;">
        영문과 한글이 혼합된 긴 문장에서 폰트 폴백 스택이 정상 동작하며 베이스라인 높이와 자간이 균일하게 유지되는지 확인합니다.
      </p>
    </div>
  </div>
</body>
</html>
